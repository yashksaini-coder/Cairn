# Deliberately unpinned. anchor_version/solana_version make `anchor build`
# fetch those exact releases, and a version that was never published fails
# with "Unknown release" -- which is what broke CI once already.
#
# Anchor rewrites this file and drops comments, so the full account lives in
# docs/COMMANDS.md. Cairn does not require the Anchor CLI at all.
[toolchain]

[features]
resolution = true
skip-lint = false

[programs.devnet]
cairn = "Gt2Ki3qNfrVMzauSJNjpHf5YUck3f9rQonkfJ6sSTNiR"

[programs.localnet]
cairn = "Gt2Ki3qNfrVMzauSJNjpHf5YUck3f9rQonkfJ6sSTNiR"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "cargo test -p cairn --test litesvm -- --nocapture"

[hooks]
