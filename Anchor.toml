# Deliberately unpinned. `anchor_version`/`solana_version` make `anchor build`
# fetch those exact releases through agave-install, and a version that was
# never published fails the build with "Unknown release" -- which is exactly
# what a pin lifted from a planning document did here.
#
# Cairn does not require the Anchor CLI at all: it emits no IDL, so
# `cargo build-sbf --arch v3` and `solana program deploy` are the whole
# toolchain. See docs/COMMANDS.md.
[toolchain]

[features]
resolution = true
skip-lint = false

[programs.localnet]
cairn = "5XY4DK4Hbxmk9u3ZQ45avwgxXr3LadMemB1MekfZh1JN"

[programs.devnet]
cairn = "5XY4DK4Hbxmk9u3ZQ45avwgxXr3LadMemB1MekfZh1JN"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

# The suite is Rust + LiteSVM, not mocha. `anchor test` still stands up
# surfpool, which is why M1 depends on it being installed, but the assertions
# all run in-process.
[scripts]
test = "cargo test -p cairn --test litesvm -- --nocapture"
